[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
markers =
    milestone0: M0 foundation
    milestone1: M1 vision / ROI
    milestone2: M2 physiology
    milestone3: M3 confidence / EVM
    milestone4: M4 baseline / change engine
    milestone5: M5 dashboard
    milestone6: M6 guided demo
    milestone7: M7 judge mode
    webcam: requires a physical camera
    slow: slower integration or launcher check
